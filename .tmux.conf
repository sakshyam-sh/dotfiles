##### GENERAL SETTINGS #####

# Use default prefix Ctrl+b (no remapping)
set-option -g prefix C-b
unbind C-a
bind C-b send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 0 (default)
set -g base-index 0
set -g pane-base-index 0

# Enable vi-style keybindings in copy mode
setw -g mode-keys vi

# Reload config with 'prefix + r'
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

##### PANE & WINDOW NAVIGATION #####

# Split panes using | and -
unbind '"'
unbind %
bind | split-window -h
bind - split-window -v

# Move between panes using Alt + Arrow keys (no prefix)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

##### COPY MODE #####

# Use 'v' to begin selection, 'y' to copy to clipboard (requires xclip)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

##### CUSTOM BINDS #####

# Bind Ctrl+F (no prefix) to launch your sessionizer
bind -n C-f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

##### STATUS BAR #####

# Refresh rate (seconds)
set -g status-interval 10

# Status bar colors and style
set -g status-style bg=black,fg=white

# Left side: session name and user
set -g status-left-length 40
set -g status-left '#[fg=green][#S]#[fg=cyan] #(whoami) #[default]'

# Right side: load average, date, time
set -g status-right-length 80
set -g status-right '#[fg=yellow]#(cut -d " " -f1-3 /proc/loadavg)#[default] #[fg=white]%Y-%m-%d %H:%M#[default]'

