#====================================================================
#  TMUX CONFIGURATION – tidy, well‑commented and ready to copy
#====================================================================

#--------------------------------------------------------------------
#  1️⃣  GENERAL SETTINGS
#--------------------------------------------------------------------
# Default prefix (Ctrl‑b).  No remapping.
set-option -g prefix C-b
set-option -g focus-events on
unbind C-a               # Unbind the historic “C‑a” prefix.
bind C-b send-prefix     # Allow nesting tmux sessions.

# Mouse support – click to select/resize panes.
set -g mouse on

# Vi‑style key bindings in copy‑mode.
setw -g mode-keys vi

# Reload the config with <prefix> + r.
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

#--------------------------------------------------------------------
#  2️⃣  PANE & WINDOW NAVIGATION
#--------------------------------------------------------------------
# Split panes without a prefix.
unbind '"'
unbind %
bind | split-window -h   # Horizontal split
bind - split-window -v   # Vertical split

# Move between panes with Alt + Arrow (no prefix needed).
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

#--------------------------------------------------------------------
#  3️⃣  COPY MODE
#--------------------------------------------------------------------
# In vi‑copy mode:
#   v – start selection
#   y – copy selection to the system clipboard (needs xclip)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

#--------------------------------------------------------------------
#  4️⃣  CUSTOM BINDS
#--------------------------------------------------------------------
# (No Ctrl‑F binding – you can run the sessionizer script directly from the
#  shell or bind it to a terminal‑emulator shortcut, see the notes below.)

#--------------------------------------------------------------------
#  5️⃣  STATUS BAR
#--------------------------------------------------------------------
# Refresh interval (seconds).
set -g status-interval 10

# Base colours – black background, white foreground.
set -g status-style bg=black,fg=white

# ── Left side (session name + current user) ────────────────────────
set -g status-left-length 40
set -g status-left '#[fg=green][#S]#[fg=cyan] #(whoami) #[default]'

# ── Right side (load average + date & time) ───────────────────────
set -g status-right-length 80
set -g status-right '#[fg=yellow]#(cut -d " " -f1-3 /proc/loadavg)#[default] #[fg=white]%Y-%m-%d %H:%M#[default]'

#====================================================================
#  END OF FILE
#====================================================================
