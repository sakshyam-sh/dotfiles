corner-radius = 10;
rounded-corners-exclude = [
  "class_g = 'i3bar'",
  "class_g = 'bar-.*'",
  "class_g = 'Polybar'"
];

backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;

vsync = false;

fading = false;

shadow = true;
shadow-radius = 15;
shadow-opacity = 0.5;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-exclude = [
  "class_g = 'i3bar'",
  "class_g = 'bar-.*'",
  "class_g = 'Polybar'"
];

blur-background = false;
blur-kern = "3x3box";

active-opacity = 100;
inactive-opacity = 90;
frame-opacity = 100;
inactive-opacity-override = false;

focus-exclude = [
  "class_g = 'Cairo-clock'"
];

detect-transient = true;
detect-client-leader = true;

wintypes: {
  tooltip = { fade = true; shadow = false; opacity = 0.9; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.9; };
  dropdown_menu = { opacity = 0.9; };
};
