icons_format = "{icon}"

[theme]
theme = "tomorrow-night"

[theme.overrides]
separator = " "

[icons]
icons = "none"

[[block]]
block = "custom"
command = "echo '◀'"
interval = 1
[[block.click]]
button = "left"
cmd = "playerctl previous"
[block.theme_overrides]
separator = ""

